name: Token check (temporary)
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          case "$GH_TOKEN" in
            github_pat_*) echo "kind: fine-grained" ;;
            ghp_*) echo "kind: classic" ;;
            "") echo "kind: EMPTY" ;;
            *) echo "kind: other prefix, length ${#GH_TOKEN}" ;;
          esac
          case "$GH_TOKEN" in *[[:space:]]*) echo "contains whitespace: yes" ;; *) echo "contains whitespace: no" ;; esac
          echo "owner: $(gh api user -q .login 2>&1)"
          echo "khol: $(gh api repos/VetBlack1/khol -q .full_name 2>&1)"
